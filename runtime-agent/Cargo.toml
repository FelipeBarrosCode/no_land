[package]
name = "noland-runtime"
version = "0.1.0"
edition = "2021"
description = "Optional No Land modern Linux userspace companion"
license = "MIT"

[dependencies]
noland-runtime-contracts = { path = "../runtime-contracts" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
