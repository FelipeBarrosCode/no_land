[package]
name = "noland-network-contracts"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Versioned network control, state, probe, and evaluation contracts for No Land"

[dependencies]
hmac = "0.13"
hex = "0.4"
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
uuid = { version = "1.10", features = ["serde", "v4"] }
