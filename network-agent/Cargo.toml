[package]
name = "noland-network-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ephemeral network quality probe and telemetry agent for No Land"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.24"
uuid = { version = "1.10", features = ["serde"] }
