[package]
name = "noland-network-agent"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Ephemeral network quality probe and telemetry agent for No Land"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
noland-network-contracts = { path = "../network-contracts" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
turn = "0.17.2"
uuid = { version = "1.10", features = ["serde"] }
webrtc-util = { version = "0.17.1", default-features = false, features = ["conn"] }
