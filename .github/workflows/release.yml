name: Build Desktop Binaries

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GSTREAMER_VERSION: 1.24.13
  NOLAND_GSTREAMER_VERSION: 1.24.13
  MAIN_PRERELEASE_TAG: main-latest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    environment: Secrets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            openssh-client \
            wireguard-tools \
            xdg-utils \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pipewire \
            rpm2cpio \
            libssl-dev \
            libopus-dev \
            libpulse-dev \
            patchelf

      - name: Install Windows managed tool dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $wireGuardDir = Join-Path ($env:ProgramFiles ?? 'C:\Program Files') 'WireGuard'
          $wgExe = Join-Path $wireGuardDir 'wg.exe'
          $wireguardExe = Join-Path $wireGuardDir 'wireguard.exe'

          if ((Test-Path $wgExe) -and (Test-Path $wireguardExe)) {
            Write-Host "WireGuard already present at $wireGuardDir"
            exit 0
          }

          if ('${{ matrix.arch }}' -eq 'arm64') {
            $msiPath = Join-Path $env:TEMP 'wireguard-arm64-1.1.msi'
            $logPath = Join-Path $env:TEMP 'wireguard-arm64-install.log'
            Invoke-WebRequest -Uri 'https://download.wireguard.com/windows-client/wireguard-arm64-1.1.msi' -OutFile $msiPath
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', $msiPath, '/qn', '/norestart', '/l*v', $logPath, 'DO_NOT_LAUNCH=1')
            if ($process.ExitCode -ne 0) {
              Write-Host "WireGuard ARM64 install failed with exit code $($process.ExitCode). MSI log: $logPath"
              if (Test-Path $logPath) {
                Get-Content $logPath -Tail 200
              }
              throw "WireGuard ARM64 MSI install failed"
            }
          } else {
            choco install wireguard -y --no-progress
          }

          if (-not ((Test-Path $wgExe) -and (Test-Path $wireguardExe))) {
            throw "WireGuard installation completed but expected executables were not found in $wireGuardDir"
          }

      - name: Install macOS managed tool dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          if command -v wg >/dev/null 2>&1 && command -v wg-quick >/dev/null 2>&1; then
            echo "WireGuard tools already present"
            exit 0
          fi
          brew install wireguard-tools

      - name: Check Apple signing secret presence
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          check_secret() {
            local name="$1"
            local value="${!name:-}"
            if [[ -n "$value" ]]; then
              echo "$name: present"
            else
              echo "$name: missing"
            fi
          }
          check_secret APPLE_CERTIFICATE
          check_secret APPLE_CERTIFICATE_PASSWORD
          check_secret KEYCHAIN_PASSWORD

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_CERTIFICATE is not configured; skipping macOS signing setup."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Resolve Apple signing identity
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_CERTIFICATE is not configured; skipping signing identity resolution."
            exit 0
          fi
          IDENTITIES=$(security find-identity -v -p codesigning build.keychain || true)
          echo "Available code-signing identities in build.keychain:"
          echo "$IDENTITIES"
          CERT_LINE=$(printf '%s\n' "$IDENTITIES" | grep -E 'Developer ID Application|Apple Distribution' | head -n 1 || true)
          CERT_ID=$(echo "$CERT_LINE" | awk -F'"' '{print $2}')
          if [[ -z "$CERT_ID" ]]; then
            echo "Unable to find a Developer ID Application or Apple Distribution identity in build.keychain." >&2
            echo "This usually means the imported .p12 is the wrong certificate type, is missing the private key, or has a different subject name than expected." >&2
            exit 1
          fi
          echo "Resolved Apple signing identity: $CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Stage CI managed tools
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        run: node scripts/stage-ci-managed-tools.mjs --target ${{ matrix.target }}

      - name: Environment diagnostics
        shell: bash
        run: |
          rustc -Vv
          node -v
          npm -v
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            where.exe ssh || true
            where.exe scp || true
            where.exe ssh-keygen || true
            where.exe wg || true
            where.exe wireguard || true
          else
            command -v ssh || true
            command -v scp || true
            command -v ssh-keygen || true
            command -v wg || true
            command -v wg-quick || true
            command -v xdg-open || true
          fi
          env | grep '^NOLAND_' || true

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          npm run tauri:build -- --target "${{ matrix.target }}"

      - name: Create macOS app zip
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          PRODUCT_NAME=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/${PRODUCT_NAME}.app"
          ZIP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/${PRODUCT_NAME}_${VERSION}_${{ matrix.arch }}.app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Verify bundled sidecars and runtime
        if: matrix.platform == 'windows'
        run: node scripts/verify-bundled-sidecars.mjs --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error

  windows-store:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: Secrets
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Windows managed tool dependencies
        shell: pwsh
        run: |
          $wireGuardDir = Join-Path ($env:ProgramFiles ?? 'C:\Program Files') 'WireGuard'
          $wgExe = Join-Path $wireGuardDir 'wg.exe'
          $wireguardExe = Join-Path $wireGuardDir 'wireguard.exe'
          if ((Test-Path $wgExe) -and (Test-Path $wireguardExe)) {
            Write-Host "WireGuard already present at $wireGuardDir"
            exit 0
          }
          choco install wireguard -y --no-progress

      - name: Stage CI managed tools
        run: node scripts/stage-ci-managed-tools.mjs --target x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Microsoft Store Windows installer
        shell: bash
        run: |
          npm run tauri:build -- --target x86_64-pc-windows-msvc --config src-tauri/tauri.microsoftstore.conf.json

      - name: Collect Microsoft Store installer artifact
        shell: bash
        run: |
          PRODUCT_NAME=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SOURCE_PATH=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' | head -n 1)
          DEST_DIR=artifacts/windows-store
          DEST_PATH="$DEST_DIR/${PRODUCT_NAME}_${VERSION}_x64-store-setup.exe"
          mkdir -p "$DEST_DIR"
          cp "$SOURCE_PATH" "$DEST_PATH"
          printf '/S\n' > "$DEST_DIR/silent-install-args.txt"
          printf 'x64\n' > "$DEST_DIR/architecture.txt"

      - name: Upload Microsoft Store installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-store-x64
          path: artifacts/windows-store
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: Secrets
    needs:
      - build
      - windows-store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Move main prerelease tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f "$MAIN_PRERELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$MAIN_PRERELEASE_TAG" --force

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || env.MAIN_PRERELEASE_TAG }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('main build {0}', github.sha) }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.msi
