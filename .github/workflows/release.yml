name: Build Desktop Binaries

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GSTREAMER_VERSION: 1.24.13
  NOLAND_GSTREAMER_VERSION: 1.24.13
  MACOSX_DEPLOYMENT_TARGET: "12.0"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    environment: Secrets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            openssh-client \
            xdg-utils \
            xvfb \
            dbus-x11 \
            cpio \
            file \
            binutils \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libdecor-0-dev \
            pkg-config \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-vaapi \
            gstreamer1.0-x \
            gstreamer1.0-pipewire \
            rpm2cpio \
            libssl-dev \
            libopus-dev \
            libpulse-dev \
            patchelf


      - name: Check Apple signing secret presence
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              echo "$name: present"
            else
              echo "$name: missing" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "macOS release artifacts must be Developer ID signed and notarized; refusing to publish an ad-hoc build." >&2
            exit 1
          fi

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_CERTIFICATE is not configured; skipping macOS signing setup."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Resolve Apple signing identity
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_CERTIFICATE is not configured; skipping signing identity resolution."
            exit 0
          fi
          IDENTITIES=$(security find-identity -v -p codesigning build.keychain || true)
          echo "Available code-signing identities in build.keychain:"
          echo "$IDENTITIES"
          CERT_LINE=$(printf '%s\n' "$IDENTITIES" | grep -E 'Developer ID Application' | head -n 1 || true)
          CERT_ID=$(echo "$CERT_LINE" | awk -F'"' '{print $2}')
          if [[ -z "$CERT_ID" ]]; then
            echo "Unable to find a Developer ID Application identity in build.keychain." >&2
            echo "This usually means the imported .p12 is the wrong certificate type, is missing the private key, or has a different subject name than expected." >&2
            exit 1
          fi
          echo "Resolved Apple signing identity: $CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Stage CI managed tools
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        run: node scripts/stage-ci-managed-tools.mjs --target ${{ matrix.target }}

      - name: Environment diagnostics
        shell: bash
        run: |
          rustc -Vv
          node -v
          npm -v
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            where.exe ssh || true
            where.exe scp || true
            where.exe ssh-keygen || true

          else
            command -v ssh || true
            command -v scp || true
            command -v ssh-keygen || true

            command -v xdg-open || true
          fi
          env | grep '^NOLAND_' || true

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          NOLAND_REQUIRE_SIGNED_RELEASE: "1"
        run: |
          npm run tauri:build -- --target "${{ matrix.target }}"

      - name: Create macOS app zip
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          PRODUCT_NAME=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/${PRODUCT_NAME}.app"
          ZIP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/${PRODUCT_NAME}_${VERSION}_${{ matrix.arch }}.app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Verify bundled sidecars and runtime
        run: node scripts/verify-bundled-sidecars.mjs --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error

  windows-store:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: Secrets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Stage CI managed tools
        run: node scripts/stage-ci-managed-tools.mjs --target ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Microsoft Store Windows installer
        shell: bash
        run: |
          npm run tauri:build -- --target "${{ matrix.target }}" --config src-tauri/tauri.microsoftstore.conf.json

      - name: Verify Microsoft Store installer
        run: node scripts/verify-bundled-sidecars.mjs --target ${{ matrix.target }}

      - name: Collect Microsoft Store installer artifact
        shell: bash
        run: |
          PRODUCT_NAME=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SOURCE_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -maxdepth 1 -name '*-setup.exe' | head -n 1)
          DEST_DIR="artifacts/windows-store-${{ matrix.arch }}"
          DEST_PATH="$DEST_DIR/${PRODUCT_NAME}_${VERSION}_${{ matrix.arch }}-store-setup.exe"
          mkdir -p "$DEST_DIR"
          cp "$SOURCE_PATH" "$DEST_PATH"
          printf '/S\n' > "$DEST_DIR/silent-install-args.txt"
          printf '${{ matrix.arch }}\n' > "$DEST_DIR/architecture.txt"

      - name: Upload Microsoft Store installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-store-${{ matrix.arch }}
          path: artifacts/windows-store-${{ matrix.arch }}
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    environment: Secrets
    needs:
      - build
      - windows-store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Determine next release version
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            next_tag="v0.0.1"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next_patch=$((patch + 1))
            next_tag="v${major}.${minor}.${next_patch}"
          fi
          echo "release_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$next_tag" >> "$GITHUB_OUTPUT"
          echo "Resolved next release tag: $next_tag"

      - name: Ensure release push token is configured
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [[ -z "$RELEASE_PAT" ]]; then
            echo "RELEASE_PAT is required for the release job because this workflow updates tags for commits that may modify GitHub Actions workflow files." >&2
            echo "Create a classic PAT or fine-grained token with contents write access and workflow permission, then store it as the RELEASE_PAT secret in the Secrets environment." >&2
            exit 1
          fi

      - name: Create git release tag
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "${{ steps.version.outputs.release_tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.version.outputs.release_tag }}"

      - name: Prepare curated release assets
        shell: bash
        env:
          WINDOWS_STORE_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          WINDOWS_STORE_PATH_PREFIX: no_land
        run: |
          node scripts/prepare-release-assets.mjs "${{ steps.version.outputs.release_tag }}"

      - name: Upload Windows Store installer to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_R2_BUCKET" || -z "$CLOUDFLARE_R2_PUBLIC_BASE_URL" ]]; then
            echo "Cloudflare R2 secrets are not fully configured; skipping Windows Store installer upload."
            exit 0
          fi

          for ARCH in x64 arm64; do
            STORE_INSTALLER=$(find release-publish -maxdepth 1 -type f -name "*_${ARCH}-store-setup.exe" | head -n 1)
            STABLE_OBJECT_KEY_FILE="release-publish/windows-store-${ARCH}-object-key.txt"
            VERSIONED_OBJECT_KEY_FILE="release-publish/windows-store-${ARCH}-versioned-object-key.txt"

            if [[ -z "$STORE_INSTALLER" || ! -f "$STABLE_OBJECT_KEY_FILE" || ! -f "$VERSIONED_OBJECT_KEY_FILE" ]]; then
              echo "No Windows Store ${ARCH} installer or object key metadata was generated; skipping this architecture."
              continue
            fi

            STABLE_OBJECT_KEY=$(tr -d '\r\n' < "$STABLE_OBJECT_KEY_FILE")
            VERSIONED_OBJECT_KEY=$(tr -d '\r\n' < "$VERSIONED_OBJECT_KEY_FILE")
            if [[ -z "$STABLE_OBJECT_KEY" || -z "$VERSIONED_OBJECT_KEY" ]]; then
              echo "Windows Store ${ARCH} object key metadata is empty; skipping this architecture."
              continue
            fi

            npx --yes wrangler@4.29.1 r2 object put "$CLOUDFLARE_R2_BUCKET/$VERSIONED_OBJECT_KEY" --file "$STORE_INSTALLER" --remote
            echo "Uploaded versioned Windows Store ${ARCH} installer to ${CLOUDFLARE_R2_PUBLIC_BASE_URL%/}/$VERSIONED_OBJECT_KEY"

            npx --yes wrangler@4.29.1 r2 object put "$CLOUDFLARE_R2_BUCKET/$STABLE_OBJECT_KEY" --file "$STORE_INSTALLER" --remote
            echo "Uploaded stable Windows Store ${ARCH} installer to ${CLOUDFLARE_R2_PUBLIC_BASE_URL%/}/$STABLE_OBJECT_KEY"
          done

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_name }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
          files: |
            release-publish/**/*
