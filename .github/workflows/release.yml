name: Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate frontend production compilation
        run: npm run build
      - name: Validate release scripts parse
        run: |
          for script in scripts/*.mjs scripts/ci/*.mjs; do node --check "$script"; done
          for script in scripts/*.sh scripts/ci/*.sh; do bash -n "$script"; done

  security:
    name: security
    needs: validation
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_security.yml
    with:
      dependency-review: false

  tests:
    name: full-test-suite
    needs: security
    uses: ./.github/workflows/_tests.yml

  version:
    name: release-version
    needs: tests
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Determine next release version without modifying refs
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          configured_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          latest_version="${latest_tag#v}"
          if [[ -z "$latest_version" ]] || [[ "$(printf '%s\n%s\n' "$latest_version" "$configured_version" | sort -V | tail -n 1)" == "$configured_version" ]]; then
            version="$configured_version"
          else
            version="$latest_version"
          fi
          IFS='.' read -r major minor patch <<< "$version"
          next_tag="v${major}.${minor}.$((patch + 1))"
          {
            echo "release_tag=$next_tag"
            echo "release_name=$next_tag"
            echo "version=${next_tag#v}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: signed-six-platform-build
    needs: [tests, version]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retain-artifacts: true
    secrets: inherit

  package-validation:
    name: package-validation
    needs: [build, version]
    runs-on: ubuntu-24.04
    environment: Secrets
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Download all six signed build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          pattern: tauri-*
      - name: Require every platform artifact
        shell: bash
        run: |
          for artifact in tauri-macos-arm64 tauri-macos-x64 tauri-linux-arm64 tauri-linux-x64 tauri-windows-arm64 tauri-windows-x64; do
            test -d "release-assets/$artifact" || { echo "Missing $artifact" >&2; exit 1; }
          done
      - name: Prepare the exact curated release set
        env:
          WINDOWS_STORE_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          WINDOWS_STORE_PATH_PREFIX: no_land
        run: node scripts/prepare-release-assets.mjs "${{ needs.version.outputs.release_tag }}"
      - name: Generate complete release checksums
        run: node scripts/ci/hash-artifacts.mjs release-publish release-publish/SHA256SUMS
      - name: Extract scannable package filesystems
        shell: bash
        run: |
          mkdir -p artifact-scan-root
          index=0
          while IFS= read -r package; do
            index=$((index + 1)); mkdir -p "artifact-scan-root/deb-$index"; dpkg-deb -x "$package" "artifact-scan-root/deb-$index"
          done < <(find release-assets -type f -name '*.deb' -print)
          while IFS= read -r archive; do
            index=$((index + 1)); mkdir -p "artifact-scan-root/mac-$index"; tar -xzf "$archive" -C "artifact-scan-root/mac-$index"
          done < <(find release-assets -type f -name '*.app.tar.gz' -print)
      - name: Block high and critical packaged dependency findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: artifact-scan-root
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: false
      - name: Generate CycloneDX SBOM for shipped package filesystems
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: artifact-scan-root
          scanners: vuln
          format: cyclonedx
          output: release-publish/SBOM.cdx.json
          exit-code: "0"
      - name: Recompute checksums including SBOM
        run: node scripts/ci/hash-artifacts.mjs release-publish release-publish/SHA256SUMS
      - name: Upload validated production release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-release-${{ github.sha }}
          path: release-publish
          if-no-files-found: error
          retention-days: 2

  release:
    name: release
    if: >-
      github.repository == 'FelipeBarrosCode/no_land' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [version, package-validation]
    runs-on: ubuntu-24.04
    environment: Secrets
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Download only the validated release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-release-${{ github.sha }}
          path: release-publish
      - name: Create and push production release tag
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "${{ needs.version.outputs.release_tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.version.outputs.release_tag }}"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_name }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
          files: release-publish/**/*
