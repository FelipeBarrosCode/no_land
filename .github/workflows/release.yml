name: Build Desktop Binaries

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GSTREAMER_VERSION: 1.24.13
  NOLAND_GSTREAMER_VERSION: 1.24.13

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-13
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm64
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            openssh-client \
            wireguard-tools \
            xdg-utils \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pipewire \
            rpm2cpio \
            libssl-dev \
            libopus-dev \
            libpulse-dev \
            patchelf

      - name: Install Windows managed tool dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install wireguard -y --no-progress

      - name: Stage CI managed tools
        if: matrix.platform == 'linux' || matrix.platform == 'windows'
        run: node scripts/stage-ci-managed-tools.mjs --target ${{ matrix.target }}

      - name: Environment diagnostics
        shell: bash
        run: |
          rustc -Vv
          node -v
          npm -v
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            where.exe ssh || true
            where.exe scp || true
            where.exe ssh-keygen || true
            where.exe wg || true
            where.exe wireguard || true
          else
            command -v ssh || true
            command -v scp || true
            command -v ssh-keygen || true
            command -v wg || true
            command -v wg-quick || true
            command -v xdg-open || true
          fi
          env | grep '^NOLAND_' || true

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Verify bundled sidecars and runtime
        if: matrix.platform == 'windows'
        run: node scripts/verify-bundled-sidecars.mjs --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error

      - name: Attach assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('main build {0}', github.sha) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
