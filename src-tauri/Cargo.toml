[workspace]
members = [".", "crates/noland-net-helper"]
resolver = "2"

[package]
name = "noland-connect"
version = "0.1.0"
description = "Noland Connect desktop app"
authors = ["Noland"]
edition = "2021"
default-run = "noland-connect"


[build-dependencies]
bindgen = "0.70.1"
cc = "1.1.31"
cmake = "0.1.51"
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
noland-rclone-adapter = { path = "../state-agent/crates/noland-rclone-adapter" }
async-trait = "0.1.83"
aes = "0.8.4"
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
crossbeam-channel = "0.5.13"
dirs = "5.0.1"
keyring = "3.6.1"
parking_lot = "0.12.3"
rand_core = "0.6.4"
raw-window-handle = "0.6.2"
rcgen = { version = "0.13.1", features = ["pem", "x509-parser", "ring"] }
reqwest = { version = "0.12.9", features = ["json", "rustls-tls"], default-features = false }
hex = "0.4"
rsa = { version = "0.9.6", features = ["pem"] }
roxmltree = "0.20.0"
serde = { version = "1.0.215", features = ["derive"] }
sha1 = "0.10.6"
sha2 = { version = "0.10.9", features = ["oid"] }
serde_json = "1.0.133"
form_urlencoded = "1"
flate2 = "1"
tar = "0.4"
urlencoding = "2"
ctrlc = "3.4.5"
tauri = { version = "2.0.0", features = ["unstable"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
thiserror = "2.0.3"
time = { version = "0.3.36", features = ["std"] }
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "time", "process", "fs", "sync"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "time"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
x509-parser = "0.16.0"
cpal = "0.18.2"
ringbuf = "0.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
