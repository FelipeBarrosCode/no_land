[package]
name = "noland-connect"
version = "0.1.0"
description = "Noland Connect desktop app"
authors = ["Noland"]
edition = "2021"
default-run = "noland-connect"

[lib]
name = "noland_connect"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
async-trait = "0.1.83"
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
dirs = "5.0.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.9", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
ssh-key = { version = "0.6.6", features = ["ed25519", "std"] }
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "time", "process", "fs", "sync"] }
tower-http = { version = "0.6.2", features = ["trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "time"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
