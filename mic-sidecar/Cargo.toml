[package]
name = "noland-mic-sender"
version = "0.1.0"
edition = "2021"
description = "Noland microphone sender sidecar"

[dependencies]
ctrlc = "3.5.2"
gstreamer = "0.23.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
coreaudio-sys = "0.2.18"
